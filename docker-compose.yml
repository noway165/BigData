# Hạ tầng đồ án: Kafka (KRaft), HDFS, Spark. Phiên bản khớp docs/04_technology_stack.md.
# Heap của mỗi service được giới hạn vì máy test chỉ có ~3,7 GB cho container.
#   docker compose up -d                      # Kafka + HDFS + Spark
#   docker compose --profile producer up -d    # thêm producer
# Podman: podman-compose với cùng file này.
name: wikipedia-realtime-analytics

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      # Client trong mạng docker dùng kafka:9092, trên máy host dùng localhost:9094.
      # "localhost" bên trong container không phải máy host, nên phải có hai listener.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tắt auto-create: topic phải được tạo với đúng số partition (docs/03_data_contract.md).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-wiki-rt-analytics-cluster}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
    networks: [wiki-net]

  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "${HDFS_UI_PORT:-9870}:9870"
    env_file: [./config/hadoop.env]
    environment:
      # Entrypoint tự format namenode nếu thư mục này chưa tồn tại. Phải trỏ vào
      # `current`, không phải /hadoop/dfs/name: volume mount tạo sẵn thư mục cha,
      # nên namenode sẽ không bao giờ được format và khởi động lỗi "not formatted".
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
      HDFS_NAMENODE_OPTS: -Xmx512m
    volumes:
      - namenode_data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 18
    networks: [wiki-net]

  datanode:
    image: apache/hadoop:3.4.1
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    env_file: [./config/hadoop.env]
    environment:
      HDFS_DATANODE_OPTS: -Xmx512m
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_started
    networks: [wiki-net]

  spark:
    image: ${SPARK_IMAGE:-apache/spark:3.5.6-scala2.12-java11-python3-ubuntu}
    container_name: spark
    hostname: spark
    user: root
    # Không chạy master/worker daemon: job submit ở local[2] như scripts/submit_*.sh,
    # đủ cho quy mô đồ án và tiết kiệm RAM cho Kafka/HDFS.
    entrypoint: ["/bin/bash", "-c", "sleep infinity"]
    ports:
      - "${SPARK_UI_PORT:-4040}:4040"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop-conf
      PYSPARK_PYTHON: python3
      APP_DIR: /opt/app
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wikipedia-recent-changes}
      HDFS_REPLICATION: "1"
    volumes:
      - .:/opt/app
      - ./config/hadoop-conf:/opt/hadoop-conf:ro
      # Cache Ivy: --packages chỉ tải jar connector một lần, buổi demo không cần mạng.
      - spark_ivy:/tmp/ivy
    depends_on:
      kafka:
        condition: service_healthy
      namenode:
        condition: service_started
    networks: [wiki-net]

  producer:
    build:
      context: .
      dockerfile: src/producer/Dockerfile
    image: wikipedia-sse-producer
    container_name: producer
    restart: unless-stopped
    profiles: ["producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wikipedia-recent-changes}
      STATS_INTERVAL_S: ${STATS_INTERVAL_S:-30}
    depends_on:
      kafka:
        condition: service_healthy
    networks: [wiki-net]

  dashboard:
    # Dùng lại image của producer: nó đã có python 3.12 và confluent-kafka, nên
    # dashboard không thêm image, dependency hay bước build nào.
    build:
      context: .
      dockerfile: src/producer/Dockerfile
    image: wikipedia-sse-producer
    container_name: dashboard
    restart: unless-stopped
    profiles: ["dashboard"]
    command: ["python", "-u", "/opt/app/src/dashboard/dashboard.py"]
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ANALYTICS_TOPIC: ${KAFKA_ANALYTICS_TOPIC:-wikipedia-analytics}
      DASHBOARD_REFRESH_S: ${DASHBOARD_REFRESH_S:-5}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wikipedia-recent-changes}
      DASHBOARD_LOG_WIKIS: ${DASHBOARD_LOG_WIKIS:-enwiki,viwiki}
      DASHBOARD_LOG_LINES: ${DASHBOARD_LOG_LINES:-60}
    volumes:
      - .:/opt/app:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [wiki-net]

volumes:
  kafka_data:
  namenode_data:
  datanode_data:
  spark_ivy:

networks:
  wiki-net:
    name: wiki-net
